[project]
name = "andy"
version = "0.1.0"
description = "A friendly LLM agent product built on top of AFK primitives"
authors = [
    { name = "arpan404", email = "itsmearpan1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "afk-py",
]

[project.scripts]
andy = "andy:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
afk-py = { git = "https://github.com/arpan404/afk" }
