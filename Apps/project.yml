name: AndyApps
options:
  bundleIdPrefix: com.andy
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
packages:
  AndyAssistant:
    path: ..
targets:
  AndyDesktop:
    type: application
    platform: macOS
    sources:
      - path: Desktop/Sources
    dependencies:
      - package: AndyAssistant
        product: AppShell
      - package: AndyAssistant
        product: MemoryStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andy.desktop
        PRODUCT_NAME: Andy Desktop
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Andy needs microphone access for push-to-talk voice interaction.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Andy needs speech recognition access to transcribe voice input.
