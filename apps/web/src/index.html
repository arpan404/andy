<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andy Console</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="mast">
        <div>
          <p class="eyebrow">Local daemon</p>
          <h1>Andy Console</h1>
        </div>
        <div class="daemon-url">
          <span>ACP bridge</span>
          <button id="refresh" type="button">Refresh</button>
        </div>
      </header>

      <section class="status-grid">
        <article>
          <span>Status</span>
          <strong id="status">unknown</strong>
        </article>
        <article>
          <span>Plugins</span>
          <strong id="pluginCount">0</strong>
        </article>
        <article>
          <span>Skills</span>
          <strong id="skillCount">0</strong>
        </article>
        <article>
          <span>Approvals</span>
          <strong id="approvalCount">0</strong>
        </article>
        <article>
          <span>Events</span>
          <strong id="eventCount">0</strong>
        </article>
        <article>
          <span>Traces</span>
          <strong id="traceCount">0</strong>
        </article>
      </section>

      <section class="workspace">
        <div class="panel wide">
          <div class="panel-head split">
            <h2>Timeline</h2>
            <span id="timelineMeta">latest 50 events</span>
          </div>
          <div id="events" class="timeline"></div>
        </div>

        <div class="panel wide">
          <div class="panel-head split">
            <h2>Traces</h2>
            <span id="traceMeta">active and hydrated trace contexts</span>
          </div>
          <div id="traces" class="trace-grid"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Plugins</h2>
          </div>
          <div id="plugins" class="list"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Skills</h2>
          </div>
          <div id="skills" class="list"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Approvals</h2>
          </div>
          <div id="approvals" class="list"></div>
        </div>

        <div class="panel command">
          <div class="panel-head">
            <h2>Agent Request</h2>
          </div>
          <label
            >Skill IDs <input id="askSkills" placeholder="andy.skills.effect-ts-coding"
          /></label>
          <label
            >Message
            <textarea id="askMessage">
Use the selected skills and summarize daemon status.</textarea
            >
          </label>
          <label
            >Image Path
            <input id="askImage" placeholder="/absolute/path/to/screenshot.png"
          /></label>
          <button id="askAgent" type="button">Run Agent</button>
        </div>

        <div class="panel command">
          <div class="panel-head">
            <h2>Run Skill</h2>
          </div>
          <label
            >Skill ID <input id="skillId" placeholder="andy.skills.remember"
          /></label>
          <label>Workflow <input id="workflow" placeholder="save" /></label>
          <label
            >Input JSON
            <textarea id="skillInput">{ "key": "editor", "value": "vim" }</textarea>
          </label>
          <button id="runSkill" type="button">Run</button>
          <pre id="output"></pre>
        </div>

        <div class="panel command">
          <div class="panel-head">
            <h2>Voice Turn</h2>
          </div>
          <label
            >Transcript
            <textarea id="voiceText">Summarize current Andy status.</textarea>
          </label>
          <label
            >Transcript File
            <input id="voiceTranscript" placeholder="/absolute/path/to/transcript.txt"
          /></label>
          <label>Voice <input id="voiceName" placeholder="system default" /></label>
          <label class="inline-check"
            ><input id="voiceSpeak" type="checkbox" checked /> Speak response</label
          >
          <div class="button-row">
            <button id="voiceTurn" type="button">Run Voice Turn</button>
            <button id="voiceStop" type="button">Stop Speech</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
